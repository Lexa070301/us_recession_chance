    📜 Условия — подписка Plus

    • Сервис: платные алерты и аналитика по индикаторам рецессии США в этом боте. Только информационные данные — не инвестиционная, финансовая или юридическая рекомендация. Исторические частоты сигналов не гарантируют будущих результатов.
    • Цена: по выбранному тарифу, показана перед оплатой. Продление вручную — автосписаний нет.
    • Возвраты: полный возврат в течение {{refund_days}} дней после оплаты через /paysupport. Возврат вычитает оплаченный период из оставшегося времени Plus (Plus отменяется, если времени не осталось).
