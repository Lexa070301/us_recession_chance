  about_title: "О проекте"
  about_desc: "Что такое US Recession Chance, откуда данные и как проект поддерживается."
  about_body: |
    US Recession Chance — независимый опенсорс-монитор риска рецессии в США. Он следит за фиксированной панелью опережающих индикаторов Федеральной резервной системы (FRED), оценивает каждый по исторически значимым порогам и складывает их в композитный прогноз на 12 месяцев, обновляющийся ежедневно.
    ## Чем он не является
    Это не торговая система, не прогноз, продаваемый как истина, и не официальное издание какого-либо института. Проект не аффилирован с ФРС, NBER или поставщиками данных — он потребляет их публичные ряды и документирует собственные правила в открытом виде.
    ## Как он поддерживается
    Определения сигналов, пороги и веса скора лежат в публичных конфигурационных файлах репозитория — каждое число на сайте воспроизводимо из них. Раз в неделю в открытый журнал публикуется самоаудит: что говорили сигналы, что изменилось и где модель расходилась сама с собой.
    ## Данные
    Все индикаторы — ряды FRED (Федеральный резервный банк Сент-Луиса). Датировка рецессий — по хронологии NBER. Исторический анализ использует винтажи ALFRED — данные в том виде, в каком они были опубликованы, а не переписанную историю — поэтому бэктесты отражают то, что было реально известно на тот момент.
  glossary_title: "Глоссарий"
  glossary_intro: "Концепции, стоящие за сигналами, простым языком."
  faq_title: "Частые вопросы"
  faq_desc: "Как устроен композитный скор, откуда берутся данные и что означают бакеты риска."
  faq:
    1:
      q: "Что означает композитный скор?"
      a: |
        Каждый сигнал находится в одном из четырёх состояний: ok, watch, warning, critical. Скор — взвешенная сумма активных состояний: watch даёт 0.5, warning — 1.0, critical — 1.5, умноженные на собственный вес сигнала. Скор отображается на четыре бакета риска, откалиброванных на истории 1967–2026: low (0–5), elevated (5–9), high (9–13), severe (13+). Читать нужно бакет, а не голое число.
    2:
      q: "Чем это отличается от вероятности рецессии NY Fed?"
      a: |
        Модель NY Fed — пробит на единственном входе: спреде 10-летних и 3-месячных казначейских. Элегантно, но одномерно: модель ошибалась или опаздывала в циклах, где кривая была честна, а кредит и труд ломались первыми. Мы включаем тот же спред-пробит как один из двадцати сигналов — риск кривой учтён, но вся оценка не висит на нём.
    3:
      q: "Как часто обновляются данные?"
      a: |
        Монитор работает ежедневно, а также в дни публикаций еженедельных и месячных рядов (заявки по четвергам, NFCI по средам, payrolls в первую пятницу). Сигналы меняют состояние только при выходе базового ряда — еженедельный сигнал не может сработать в середине недели на старых данных.
    4:
      q: "Означает ли бакет high или severe, что рецессия неизбежна?"
      a: |
        Нет. Это вероятностные бакеты, а не приговор. Исторически даже severe-бакет видел случаи, когда рецессия не наступала в течение 12 месяцев, а elevated-показания предшествовали и рецессиям, и мягким посадкам. Бакеты сообщают, что происходило после похожих конфигураций в прошлом — не больше.
    5:
      q: "Это инвестиционная рекомендация?"
      a: "Нет. Всё здесь — информационные данные: публичные индикаторы, прогнанные через публичные правила. Тайминг рецессии — лишь один из входов для финансовых решений; сайт сознательно не делает никаких портфельных утверждений."
    6:
      q: "Откуда берутся данные?"
      a: "Все индикаторы — публичные ряды FRED (Федеральный резервный банк Сент-Луиса); у каждой страницы сигнала есть ссылка на источник. Датировка рецессий — официальная хронология NBER. Анализ в точке времени использует винтажи ALFRED — данные в том виде, в каком выходили изначально."
    7:
      q: "Что такое ревизии данных и винтажи?"
      a: "Экономические ряды переписываются: payrolls ревизуются месяцами, у ВВП три официальные оценки плюс ежегодные перерасчёты, даже ряды безработицы рестейтят. Бэктест на сегодняшней переписанной истории слегка жульничает. Мы храним винтажи ALFRED, чтобы исторический анализ использовал данные ровно в том виде, как они публиковались."
    8:
      q: "Сервис бесплатный?"
      a: "Публичные каналы, ежедневные дайджесты, этот сайт и методология — бесплатны. Платный тариф бота добавляет мгновенные алерты (вместо дайджеста), персональные пороги скора, фильтры по сигналам, тихие часы и команды по запросу вроде /episodes и /analytics."
