  article:
    r1969:
      title: "Рецессия 1969–70"
      body: |
        Рецессия 1969–70 была сознательно спроектированным замедлением — первым послевоенным эпизодом, где политика открыто меняла рост на ценовую стабильность. В 1968–69 ФРС агрессивно ужесточалась, остужая инфляцию, накопленную вьетнамскими дефицитами, а фискальная политика качнулась от дефицита $5.2 млрд к профициту ~$10 млрд — колоссальный отток спроса за один год.
        ## Как развивалось
        Рост остановился в конце 1969-го, экономика сжималась большую часть 1970-го. Безработица выросла с 15-летнего минимума 3.4% до ~6%, но спад оставался мягким по всем агрегатам — услуги и потребление держались, удар приняли товарное производство и жильё.
        ## Почему это важно для сигналов
        Это чистейший пример процентной рецессии: кривая ужесточилась задолго до разворота активности, наградив опережающие индикаторы финансовых условий. Кривая уже инвертировалась в кредитный кранч 1966 — тогда вышло замедление без рецессии — что делает эпоху каноническим уроком: инверсия — предупреждение, а не приговор.
        > **Факт:** Спад длился 11 месяцев (декабрь 1969 – ноябрь 1970). Инфляция почти не отреагировала — снизилась лишь незначительно — предвещая куда более жёсткое лекарство, которое ФРС применит в 1980-х.
    r1973:
      title: "Рецессия 1973–75"
      body: |
        Рецессия 1973–75 — глубочайший спад в США между 1930-ми и 2008 годом: столкновение спросового бума, снабженческого шока и краха ценового контроля. Заморозка цен Никсона 1971 года искусственно удерживала инфляцию; когда контроль ослаб в 1973-м, цены рванули вверх — ровно когда октябрьское эмбарго ОПЕК за три месяца учетверило нефть.
        ## Две стадии спада
        Анализ NBER делит эпизод на две части. С ноября 1973 по осень 1974 экономика сжималась умеренно — в основном история ограниченного предложения: очереди за бензином и дефицит материалов душили выпуск. После октября 1974-го рухнул сам спрос: промпроизводство, занятость и реальные доходы сломались одновременно, безработица к маю 1975 достигла 9%.
        ## Рекорд сигналов
        Жилищные индикаторы предупредили первыми — старты и пермиты развернулись в 1973-м, задолго до пика NBER. Кривая инвертировалась в 1973-м, заявки ускорялись весь 1974-й. Это эпизод, породивший слово, которого боится каждый прогнозист: стагфляция — цены растут при падающем выпуске, ломая простую логику кривой Филлипса.
        > **Факт:** S&P 500 потерял 48% от пика (январь 1973 – октябрь 1974) — худшее падение со времён Великой депрессии. Рецессия длилась 16 месяцев — самая долгая послевоенная, пока 2007–09 не повторила рекорд.
    r1980:
      title: "Рецессия 1980"
      body: |
        Рецессия 1980 — первый выстрел Пола Волкера по инфляции и одна из страннейших в истории: часть ущерба нанесли собственные кредитные контроли. В октябре 1979-го ФРС перешла к таргетированию резервов, отпустив ставку в плавание; к апрелю 1980 она стояла на 17.6%. Поверх этого президент Картер в марте 1980 задействовал закон о кредитном контроле, призвав кредиторов сдерживать потребительский кредит.
        ## Шок спроса по запросу
        Потребители отреагировали быстрее всех ожиданий: расходы по кредитным картам замёрзли почти мгновенно. Производство потеряло 1.1 млн рабочих мест за месяцы, автопром — треть персонала, жильё замерло. Но рецессия длилась всего шесть месяцев — когда контроли сняли в июле, отложенный спрос вернулся так быстро, что восстановление едва заметно на графиках.
        ## Почему это важно для сигналов
        Доминировали финансовые и кредитные сигналы: кривая глубоко инвертировалась весь 1979-й, условия кредита ужесточались сами до контролей, жильё лидировало спад на месяцы. Трудовые подтвердили поздно — безработица пиковала на 7.8% в июле 1980, по сути на самом дне, напоминая: сигналы типа Сама датируют начало, а не прогнозируют.
        > **Факт:** Спад 1980 — кратчайшая мирная рецессия в современном списке NBER, шесть месяцев. И единственная, частично вызванная заморозкой кредита, которую правительство попросило нарочно.
    r1981:
      title: "Рецессия 1981–82"
      body: |
        Едва год прошёл с начала восстановления 1980-го, как экономика провалилась обратно — второе дно знаменитой двойной рецессии и самая болезненная дезинфляция в современной истории ФРС. Волкер держал ставку около 19%, а прайм-рейт выше 21% весь 1981-й; ничто в кредитной экономике не могло долго работать при таких ценах.
        ## Цена доверия
        Производство и строительство выдуло — ярлык «ржавого пояса» из этой эпохи — а безработица выросла до 10.8% в конце 1982-го: послевоенный рекорд, стоящий до сих пор. Рецессия шла 16 месяцев, сравнявшись с 1973–75. Взамен инфляция обрушилась с двузначных значений ниже 4% за год после дна.
        ## Рекорд сигналов
        Почти каждый опережающий индикатор предупреждал последовательно: кривая инвертировалась в 1980–81, пермиты и старты падали с начала 1981, кредитные спреды расширялись, заявки росли весь год. Это учебный случай сложения сигналов: к середине 1981 активна почти вся панель — так выглядит severe-бакет на практике.
        > **Факт:** Безработица держалась выше 10% десять месяцев подряд — длительность двузначной безработицы, не повторявшаяся с тех пор: ни в 2009-м (10% один месяц), ни в 2020-м (14.7% один месяц).
    r1990:
      title: "Рецессия 1990–91"
      body: |
        Рецессия 1990–91 соединила три шока, редко приходящих вместе: цикл ужесточения ФРС (1988–89), внутренний кредитный кранч от краха ссудо-сберегательных ассоциаций и нефтяной всплеск после вторжения Ирака в Кувейт в августе 1990-го. ВВП сжался умеренно — но восстановление прославилось тем, чего не случилось: рабочие места не вернулись.
        ## Рецессия кредитного кранча
        Сотни трефтов банкротились, коммерческая недвижимость ушла под воду, регуляторы одновременно затянули стандарты кредитования — банки просто перестали кредитовать. Когда нефть прыгнула с $17 до $36 за баррель за три месяца, и без того хрупкое доверие потребителей и бизнеса сломалось. Безработица росла до конца рецессии и продолжала карабкаться до июня 1992-го.
        ## Рекорд сигналов
        Кривая так и не инвертировалась полноценно перед этой рецессией — один из чистейших её промахов — зато кредитные и жилищные сигналы (ужесточение стандартов, падающие пермиты в 1988–89) поймали ухудшение рано. Это канонический аргумент за панель: кривая проморгала, а кредит сказал правду.
        > **Факт:** Термин «восстановление без рабочих мест» придуман здесь: выпуск рос с апреля 1991-го, а безработица пиковала через 15 месяцев — в июне 1992-го. Лага хватило, чтобы, возможно, стоить Бушу-старшему переизбрания.
    r2001:
      title: "Рецессия 2001"
      body: |
        Рецессия 2001-го была инвестиционным, а не потребительским крахом. Nasdaq пиковала в марте 2000-го и в итоге потеряла 78% стоимости; мания капитальных вложений конца 90-х — оптоволокно, серверы, зарплаты доткомов — раскручивалась обратно весь 2000–01-й по мере испарения прибылей. ВВП почти не упал: рецессия проявилась в расходах бизнеса и занятости, а не в потреблении.
        ## Прерванный спад
        ФРС снизила ставку с 6.5% до 1.75% за год, и экономика стабилизировалась, когда случилось 11 сентября — заморозившее поездки, страхование и доверие на квартал и растянувшее спад до 8 месяцев. Корпоративные скандалы (Enron в конце 2001-го, WorldCom в 2002-м) отравляли настроения на рынках далеко за официальным дном.
        ## Рекорд сигналов
        Инверсия предупредила раньше всех — кривая была инвертирована большую часть 2000-го. Финансовый стресс пришёл раньше труда: заказы на дурэйблы и временная занятость снижались весь 2000-й, заявки и правило Сама подтвердили около официального пика в марте 2001-го. Снова восстановление без мест — безработица пиковала лишь в июне 2003-го, через 19 месяцев после конца рецессии.
        > **Факт:** По падению ВВП — мягчайшая послевоенная рецессия: реальный выпуск ни разу не падал два квартала подряд. По payrolls исчезло 2.7 млн мест — боль труда сильно превышала то, что показывали данные выпуска.
    gfc:
      title: "Великая рецессия (2007–09)"
      body: |
        Рецессия 2007–09 — глубочайший спад в США со времён Великой депрессии: 18 месяцев, жилищный пузырь, переросший в мировой банковский кризис. Цены на жильё пиковали в 2006-м, сабпрайм-убытки всплывали весь 2007-й, и официальный пик NBER — декабрь 2007 — предшествует драме, которую все помнят.
        ## Три акта
        Акт первый — медленное удушение: жилищные индикаторы ухудшались весь 2006–07-й на фоне растущих акций. Акт второй — финансовый инфаркт: Bear Stearns в марте 2008-го, затем крах Lehman 15 сентября 2008-го, превративший жилищную рецессию в глобальную панику; кредитные рынки замёрзли за дни. Акт третий — каскад в реальном секторе: мировая торговля рухнула, payrolls теряли по 700+ тысяч мест в месяц в начале 2009-го, безработица удвоилась до 10%.
        ## Рекорд сигналов
        Сильнейшая историческая игра панели: пермиты и старты предупреждали с середины 2006 — примерно за 18 месяцев до пика, кредитные условия ужесточались весь 2007-й, NFCI достиг критики в 2008-м до Lehman. Кривая инвертировалась в 2006–07. Почти все прогнозные сигналы были активны к официальному началу — композит стоял бы в severe-бакете.
        > **Факт:** Ответ ФРС изобрёл современный плейбук — ставка в ноль впервые в истории (декабрь 2008) плюс количественное смягчение. Последовавшая экспансия длилась 128 месяцев — длиннейшая в истории США, пока её не прервал COVID.
    covid:
      title: "COVID-рецессия (2020)"
      body: |
        COVID-рецессия держит два рекорда сразу: кратчайшая в хронологии NBER — всего два месяца, февраль–апрель 2020 — и резчайшее помесячное ухудшение за всю историю измерений. Безработица прыгнула с 50-летнего минимума 3.5% до 14.7% за восемь недель; ВВП второго квартала упал почти на 30% в годовом выражении.
        ## Рецессия по указу
        Все предыдущие рецессии вырастали из экономических дисбалансов; эту назначили локдауны. Это сделало традиционные опережающие индикаторы почти бесполезными — ни кривая, ни спреды, ни жильё не могли предвидеть пандемию — и возвысило nowcast-блок: правило Сама сработало в апреле 2020 в реальном времени, быстрее любого подтверждения по ВВП.
        ## Рекорд сигналов
        Быстрее всех рассказали заявки: первичные показали 6.6 млн за неделю в конце марта — десятикратный рекорд — сделав эпизод тем случаем, где высокочастотные данные труда отработали себя. Финансовый стресс вспыхнул и был задавлен за недели крупнейшим монетарно-фискальным ответом в истории — отсюда и быстрейшее восстановление.
        > **Факт:** Комитет NBER объявил начало рецессии в июне 2020-го, датировав дно апрелём — экономика уже восстанавливалась к моменту официального объявления. В быстрых циклах латентность сигналов важнее всего.
    scare2324:
      title: "Инверсия-пугало 2023–24"
      body: |
        С июля 2022-го кривая 2y/10y была непрерывно инвертирована — со временем пройдя 624 дня и став длиннейшей инверсией в истории, превзойдя серию 1978 года. Пробит-модель 10Y–3M давала вероятность рецессии около 77% к маю 2023-го. Все плейбуки говорили, что спад придёт в 2023-м. Он так и не пришёл.
        ## Почему сигнал ошибся
        Механизм инверсии — сдавливание банковской маржи и удушение кредита — был притуплен депозитным избытком: банки платили по вкладам почти ноль, маржа держалась, кредит тек. А фискальный стимул, зафиксированные низкие ипотеки и приток рабочей силы держали спрос упругим. Кривая верно измеряла ожидания по ставкам — сломался канал трансмиссии.
        ## Чему это учит
        Монитор на одном сигнале горел бы красным два года подряд — и всё это время ошибался бы. Сильнейший аргумент за композитную панель: кредитные спреды оставались спокойными, NFCI не держал стресс, спрос на труд остывал без коллапса. Эпизод включён сюда сознательно: монитор, публикующий только свои попадания, — маркетинг, а не методология.
        > **Факт:** Правило Сама сработало в августе 2024-го — первое фолс-позитивного типа срабатывание — на росте рабочей силы, а не увольнений, без последовавшей рецессии. Даже «безошибочные» сигналы ошибаются; поэтому композит просит подтверждения, а не уверенности.
  signal_page:
    yield_curve_inversion: "Спред 10-летних минус 3-месячных казначейских — самый изученный предиктор рецессии: короткие ставки выше длинных означают, что рынок ждёт снижений — исторически из-за слабеющего роста. Предшествовал каждой рецессии США с конца 1960-х с типичным опережением 6–18 месяцев, хотя дал ложные тревоги в 1966–67 и 2023–24."
    curve_10y2y_inversion: "Пара 10-летних/2-летних — самый наблюдаемый спред рынка и обычно инвертируется позже 10Y–3M. Здесь служит подтверждением, а не первичным триггером — два независимых измерения кривой, сходящихся во мнении, весят больше каждого по отдельности."
    yield_curve_resteepening: "Опасный момент исторически — не сама инверсия, а быстрое восстановление наклона после неё: кривая раскрывается, потому что ФРС начинает резать на трескающейся экономике. В 1990, 2001, 2007 и 2020-м рестипенинг кластеризовался вокруг начала рецессии — сигнал подтверждения с коротким лагом."
    nyfed_recession_prob: "Опубликованная пробит-модель ФРБ Нью-Йорка превращает спред 10Y–3M напрямую в вероятность рецессии на 12 месяцев — тот же спред, что мы отслеживаем, в виде числа. Включена как самостоятельный сигнал и заодно служит основой модельной строки этого сайта."
    nfci_tightening: "NFCI ФРБ Чикаго сжимает 105 финансовых рядов — денежные рынки, кредит, леверидж — в еженедельный индекс, где ноль означает средние условия. Устойчивые положительные значения сопровождали каждый кредитный спад с 1973-го, часто ужесточаясь до реакции данных труда."
    stlfsi_stress: "Индекс стресса ФРБ Сент-Луиса агрегирует 18 рядов по доходностям, спредам и волатильности в один измеритель стресса. Он волатильнее NFCI, но реагирует быстрее — полезен как ранний детектор финансовой паники, особенно в эпизодах вроде марта 2020-го."
    hy_spread: "Спреды хай-йилда измеряют премию, которую платят заёмщики мусорного рейтинга сверх казначейских. Расширение означает переписывание рынком дефолтного риска — исторически резко растёт до и во время каждой рецессии; один из самых быстрых еженедельных индикаторов кредитного стресса."
    bbb_spread: "Опцион-скорректированный спред BBB — инвестиционный аналог: дешевейший ярус заимствования над мусором. Расширение премии BBB подтверждает, что стресс выходит из спекулятивного яруса в мейнстрим-кредит — сигнал-корроборатор, а не самостоятельный лидер."
    sloos_tightening: "Опрос ФРС старших кредитных инспекторов напрямую спрашивает банки, ужесточают ли они стандарты по промышленным кредитам. Банкиры сжимают кредит до видимого ослабления заёмщиков — делая SLOOS одним из немногих опросов, реально опережающих события, хотя выходит он лишь раз в квартал."
    permits_decline: "Строительные пермиты опережают само строительство на месяцы, а строительство — цикл: жильё входило почти в каждую рецессию США первым, иногда за два года (2006-й против пика 2007-го). Устойчивое годовое снижение — одно из самых медленных, но надёжных предупреждений панели."
    housing_starts_decline: "Старты строительства подтверждают сигнал пермитов в реальной активности: фактические закладки, падающие год к году, означают, что застройщики видят спрос впереди. Жильё — самый чувствительный к ставке сектор, поэтому двигается первым при ужесточении политики."
    durable_orders_decline: "Заказы на товары длительного пользования отражают готовность бизнеса и потребителей к крупным покупкам — машины, оборудование, бытовая техника. Зашумлены помесячно, но годовой тренд разворачивается отрицательным рано в замедлениях: фирмы откладывают инвестиции первыми."
    claims_trend: "Еженедельные первичные заявки на пособие — самый высокочастотный трудовой индикатор из существующих: растущая 4-недельная средняя означает начало увольнений в реальном времени, за недели до подтверждения payrolls. Самый ранний трудовой сигнал панели."
    continued_claims_rise: "Продолженные заявки измеряют, как долго безработные остаются безработными: растущая застрахованная безработица означает, что уволенные не находят мест — ухудшение серьёзнее, чем просто увольнения. Растёт от циклического дна по мере потери рынком поглощающей способности."
    temp_help_decline: "Фирмы режут временный персонал раньше постоянного — временная занятость амортизирует рынок труда и исторически разворачивается за месяцы до payrolls. Устойчивое годовое снижение предшествовало каждой рецессии, для которой ряд существует."
    jolts_flows: "JOLTS отслеживает вакансии и увольнения по собственному желанию: падающие вакансии — остывающий спрос на труд, падающие quits — работники перестали верить во внешние возможности. Ухудшение обоих вместе ловит треск доверия рынка труда с двух сторон."
    cfnaid_weak: "Национальный индекс активности ФРБ Чикаго усредняет 85 месячных индикаторов производства, занятости, потребления и жилья в единую диффузную меру. Среднее за 3 месяца ниже −0.7 исторически совпадало с экономикой, работающей заметно ниже тренда — широкая слабость, а не отказ одного сектора."
    indpro_decline: "Промышленное производство — один из четырёх совпадающих рядов, на которые опирается сам NBER при датировке рецессий. Годовое снижение почти совпадает с рецессией — как предупреждение приходит поздно, но надёжно подтверждает, что замедление реально."
    sahm_rule: "Правило Сама срабатывает, когда средняя за 3 месяца безработица стоит на 0.5 п.п. выше минимума за 12 месяцев — почти безошибочный детектор начала рецессии в реальном времени, придуманный Клаудией Сам. Ключевое: оно датирует начало, а не прогнозирует — поэтому в nowcast-блоке и без прогнозного веса."
    chauvet_piger: "Сглаженные вероятности рецессии Шове–Пайгер оценивают шанс того, что экономика уже в рецессии, используя те же четыре совпадающих ряда, что и NBER. Значения, прыгнувшие и удержанные, исторически совпадали с официальной датировкой — лучший рыночный измеритель «а мы уже внутри?»."
    sahm_states: "Экспериментальный региональный наукаст: счётчик штатов, пересёкших собственный триггер Сама. Рецессии редко начинаются равномерно — диффузия по штатам может показать расширение спада до срабатывания национальной ставки, ценой более шумных срабатываний."
