bot:
  start: |
    👋 Добро пожаловать в US Recession Watch.

    Я слежу за опережающими индикаторами рецессии в США (кривая доходности, кредитные спреды, рынок труда, жильё) и присылаю уведомления при смене их состояния.

    /status — текущие сигналы и композитный риск
    /signals — выбор отслеживаемых сигналов
    /settings — уведомления, язык, доставка
    /analytics — статистика по сигналам
    /digest HH:MM — своё время дайджеста
    /plan — подписка
    /terms — условия использования
    /paysupport — поддержка по платежам

    ⚠️ Только информационные данные — не инвестиционная рекомендация. Исторические частоты не гарантируют будущих результатов.
  disclaimer_short: "Только информационные данные — не инвестиционная рекомендация."
  status_empty: "Активных предупреждающих сигналов нет."
  settings_title: "⚙️ Настройки"
  settings_delivery: "Режим доставки"
  delivery_instant: "Мгновенные алерты"
  delivery_digest: "Дневной дайджест"
  settings_min_severity: "Минимальная важность"
  settings_lang: "Language / Язык"
  settings_daily_digest: "Дневной дайджест"
  settings_weekly_digest: "Недельный дайджест"
  settings_nowcast: "Nowcast-алерты"
  settings_score_alert: "Порог скора"
  settings_score_off: "выкл"
  settings_digest_time: "Время дайджеста (UTC)"
  digest_time_hint: "Отправьте /digest HH:MM (UTC), чтобы задать своё время — /digest off вернёт стандартное {{default}}."
  digest_time_set: "Время дайджеста: {{time}} UTC ✅"
  digest_time_reset: "Время дайджеста сброшено на стандартное ({{default}} UTC)."
  digest_invalid: "Формат: /digest HH:MM (UTC), например /digest 07:30 — или /digest off"
  upgrade_hint: "🔓 Plus открывает мгновенные алерты, порог скора, nowcast и расписание дайджеста — /plan"
  settings_updated: "Настройки обновлены ✅"
  settings_plus_only: "🔒 Доступно на тарифе Plus — /plan"
  signals_title: "📡 Сигналы (нажмите для переключения)"
  plan_title: "💎 Тариф Plus"
  plan_desc: |
    Plus включает:
    • Мгновенные алерты переходов и nowcast (в каналах — только дайджесты)
    • Сигналы уровня «наблюдение» + выбор отдельных сигналов
    • Персональный порог композитного скора
    • /analytics — статистика по каждому сигналу
    • Своё время дайджеста; дайджесты можно отключить
    Цена: {{stars}} Stars / {{days}} дней
  plan_invoice: "Подписка Plus — {{days}} дней"
  plan_active: "✅ Plus активна до {{until}}"
  plan_thanks: "🎉 Спасибо! Plus активна до {{until}}"
  plan_expired: "Подписка Plus истекла. Переведены на бесплатный дайджест."
  terms: |
    📜 Условия — подписка Plus

    • Сервис: платные алерты и аналитика по индикаторам рецессии США в этом боте. Только информационные данные — не инвестиционная, финансовая или юридическая рекомендация. Исторические частоты сигналов не гарантируют будущих результатов.
    • Цена: {{stars}} Stars за {{days}} дней. Продление вручную — автосписаний нет.
    • Возвраты: полный возврат в течение {{refund_days}} дней после оплаты через /paysupport. Возврат вычитает {{days}} дней из оставшегося времени Plus (Plus отменяется, если времени не осталось).
    • Доступность зависит от внешних данных (FRED) и Telegram — гарантий аптайма нет.
    • Telegram не является стороной покупки; поддержка Telegram не поможет с платежами в этом боте.
  terms_consent: "Оплачивая, вы соглашаетесь с условиями — /terms"
  pay_agree: "✅ Согласен — оплатить {{stars}}⭐"
  paysupport: |
    💳 Поддержка по платежам

    Покупки совершаются в Telegram Stars — поддержка Telegram не обрабатывает возвраты для этого бота, это делает только разработчик.

    Политика: полный возврат в течение {{refund_days}} дней после оплаты. Возврат вычитает {{days}} дней из оставшегося времени Plus.

    Нажмите на платёж ниже, чтобы вернуть его:
  refund_item: "↩️ Вернуть {{stars}}⭐ — {{date}}"
  refund_none: "Сейчас нет платежей, доступных к возврату."
  refund_confirm: "Вернуть {{stars}} Stars, оплаченные {{date}}? Из вашего времени Plus будет вычтено {{days}} дн."
  refund_yes: "✅ Вернуть {{stars}}⭐"
  refund_no: "Отмена"
  refund_done: "✅ {{stars}} Stars возвращены. Plus активен до {{until}}."
  refund_done_canceled: "✅ {{stars}} Stars возвращены — Plus отменён."
  refund_failed: "❌ Возврат не удался — попробуйте позже."
  refund_unavailable: "Этот платёж больше нельзя вернуть."
  error_generic: "Что-то пошло не так, попробуйте позже."

signal:
  yield_curve_inversion:
    name: "Инверсия кривой (10Y–3M)"
    desc: "Спред 10Y–3M ниже нуля — классический опережающий сигнал рецессии."
  curve_10y2y_inversion:
    name: "Инверсия кривой (10Y–2Y)"
    desc: "Самая наблюдаемая пара кривой; подтверждает сигнал 10Y–3M."
  yield_curve_resteepening:
    name: "Разворот кривой вверх"
    desc: "Быстрый рост спреда 10Y–3M после инверсии — исторически кластеризуется у начала рецессии."
  nyfed_recession_prob:
    name: "Вероятность рецессии (NY Fed)"
    desc: "12-месячная вероятность рецессии по probit-модели спреда."
  nfci_tightening:
    name: "Финансовые условия (NFCI)"
    desc: "Индекс ФРБ Чикаго; выше нуля — условия жёстче среднего."
  stlfsi_stress:
    name: "Финансовый стресс (STLFSI)"
    desc: "Стресс-индекс ФРБ Сент-Луиса; выше нуля — стресс выше среднего."
  hy_spread:
    name: "Спред high-yield"
    desc: "OAS индекса HY ICE BofA; расширение — переоценка риска дефолта."
  bbb_spread:
    name: "Спред BBB"
    desc: "Премия инвестиционного кредита; расширение стресса за пределы HY."
  sloos_tightening:
    name: "Кредитные стандарты банков"
    desc: "Чистая доля банков, ужесточивших стандарты C&I-кредитов (SLOOS)."
  permits_decline:
    name: "Разрешения на строительство"
    desc: "Падение разрешений г/г — ранний сигнал жилищного цикла."
  housing_starts_decline:
    name: "Начатое строительство"
    desc: "Падение новых строек г/г."
  durable_orders_decline:
    name: "Заказы на товары длит. пользования"
    desc: "Новые заказы падают г/г (прокси ISM new orders)."
  claims_trend:
    name: "Первичные заявки на пособие"
    desc: "4-недельная средняя растёт — самый ранний сигнал рынка труда."
  continued_claims_rise:
    name: "Продолжённые заявки"
    desc: "Страховая безработица растёт от минимума цикла."
  temp_help_decline:
    name: "Временная занятость"
    desc: "Занятость в temp-агентствах падает г/г — темпов сокращают первыми."
  jolts_flows:
    name: "Потоки JOLTS"
    desc: "Вакансии и добровольные увольнения снижаются — спрос на труд остывает."
  cfnaid_weak:
    name: "Индекс активности CFNAI"
    desc: "Национальный индекс активности ФРБ Чикаго, MA3 ниже -0.7 — широкое ослабление активности."
  indpro_decline:
    name: "Промышленное производство"
    desc: "Промпроизводство падает г/г — почти совпадающий индикатор."
  sahm_rule:
    name: "Правило Сэм"
    desc: "Безработица ≥0.5 п.п. выше минимума 12 мес — сигнал НАЧАЛА рецессии, не прогноз."
  chauvet_piger:
    name: "Вероятность рецессии (Chauvet–Piger)"
    desc: "Сглаженная вероятность того, что экономика уже в рецессии."

series:
  yield_10y3m: "Спред 10Y–3M"
  yield_10y2y: "Спред 10Y–2Y"
  icsa: "Первичные заявки"
