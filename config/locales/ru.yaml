glossary:
  yield_curve_inversion:
    title: "Инверсия кривой доходности"
    desc: "Что такое инвертированная кривая казначейских, почему она предсказывает рецессии и где она ошибалась."
    body: |
      Кривая доходности показывает стоимость заимствования казначейства по срокам. В норме длинные ставки выше коротких — инвесторы требуют премию за заморозку денег. Инверсия переворачивает картину: короткие доходности поднимаются над длинными, потому что рынок ждёт снижения ставки ФРС в будущем — обычно на фоне слабеющего роста.
      ## Почему она предсказывает рецессии
      Работают два механизма. Ожидания: трейдеры, закладывающие будущие снижения, неявно закладывают будущую слабость. Кредитная механика: банки занимают коротко и кредитуют длинно, поэтому инверсия давит маржу кредитования и отбивает охоту выдавать новые займы — ужесточая финансовые условия до прихода спада. Спред 10Y–3M предшествовал каждой рецессии США с конца 1960-х, как правило за 6–18 месяцев.
      ## Где она ошибается
      Это предупреждение, а не приговор. Инверсии 1966–67 и 2023–24 рецессии не дали — вторая стала длиннейшей ложной тревогой в истории: депозитный избыток сохранил маржу банков, и кредитный канал не сработал. Поэтому монитор трактует кривую как один из двадцати сигналов, а не как оракула.
      > **Факт:** После инверсии 2022–24 аналитики публично объявляли сигнал «сломанным». Похожие некрологи писали после ложной тревоги 1966-го — после чего кривая верно предсказала следующие восемь рецессий.
  sahm_rule:
    title: "Правило Сама"
    desc: "Детектор начала рецессии в реальном времени на основе безработицы — что измеряет и где пределы."
    body: |
      Правило Сама, предложенное экономистом Клаудией Сам в 2019 году, срабатывает, когда средняя за три месяца безработица поднимается на 0.5 процентного пункта выше минимума за предыдущие двенадцать месяцев. Оно верно определило начало каждой рецессии США с 1970-х, обычно в пределах месяцев от пика NBER.
      ## Почему работает
      Безработица растёт самоподдерживающеся при начале рецессии: увольнения режут доходы, доходы режут спрос, спрос производит новые увольнения. Порог 0.5 п.п. настроен ловить этот переход, отфильтровывая обычный шум рынка труда: небольшие отклонения ничего не значат, но импульс за полпункта почти всегда означает начавшийся спад.
      ## Чем оно не является
      Сознательно не прогноз — правило датирует начало, а не предсказывает его, поэтому в мониторе оно сидит в nowcast-блоке с нулевым прогнозным весом. И у него случилась первая историческая оговорка в августе 2024-го: срабатывание на росте рабочей силы (больше ищущих, а не больше уволенных) без последовавшей рецессии.
      > **Факт:** Изначально правило было придумано ради практики, а не науки — Сам проектировала его как автоматический триггер для стимулирующих выплат, потому что Конгресс традиционно действует на месяцы позже нужного.
  nber_recession:
    title: "Как NBER датирует рецессии"
    desc: "Кто официально объявляет рецессии в США, по каким критериям и почему объявления приходят с опозданием."
    body: |
      В США рецессии объявляет не правительство и не правило ВВП — их датирует задним числом Комитет по датировке бизнес-циклов Национального бюро экономических исследований (NBER), частной исследовательской организации, чья хронология является признанным стандартом.
      ## Не «два квартала ВВП»
      Популярная формула «два квартала отрицательного ВВП подряд» — эвристика, а не определение. Комитет взвешивает корзину месячных индикаторов — занятость, реальные личные доходы, промпроизводство, оптово-розничные продажи — ища снижение, одновременно значимое, устойчивое и широкое по экономике.
      ## Почему решения запаздывают
      Официальные объявления приходят через 4–21 месяц после факта: комитет предпочитает точность скорости, дожидаясь ревизий и однозначного тренда. COVID-рецессию объявили в июне 2020-го — когда она уже закончилась (дно в апреле). Именно эта встроенная задержка и делает сигнальный мониторинг нужным: к моменту вердикта NBER эпизод обычно уже история.
      > **Факт:** Комитет собрался в июле 2021-го, чтобы датировать дно COVID — самый быстрый вердикт по дну на record. Пик рецессии 1980-го был объявлен в июне того же года, через пять месяцев — необычно быстро, потому что спад был уже очевиден.
  credit_spread:
    title: "Кредитные спреды"
    desc: "Премия корпоративных заёмщиков к казначейским — термометр стресса рынка."
    body: |
      Кредитный спред — дополнительная доходность, которую платит корпоративная облигация сверх сопоставимой казначейской: компенсация за риск дефолта. Опцион-скорректированный спред (OAS) вычищает встроенные опционы для честного сравнения. Расширение спредов означает, что инвесторы переоценивают шансы дефолта; сжатие — что кредит считается безопасным.
      ## Хай-йилд против инвестиционного
      Спреды хай-йилда — чувствительный край: мусорные эмитенты падают первыми, поэтому HY OAS расширяется раньше и резче, обычно улетая выше 5–6% в рецессиях против ~3% в спокойствие. Спред BBB отслеживает инвестиционный кредит: расширение там означает выход стресса из спекулятивного яруса в мейнстрим — куда более серьёзная эскалация.
      ## Почему опережает
      Кредитные рынки переоценивают риск по ожиданиям, а не по реализованным потерям — спреды начинают расширяться при ещё низких дефолтах, часто раньше, чем акции признают проблему. В 2007–08 хай-йилд расширялся за месяцы до треска рынка труда; в 2015–16 спреды верно отметили нефтяной кризис, рецессией так и не ставший.
      > **Факт:** В феврале–марте 2020-го HY OAS прыгнул с 3.6% до 10%+ примерно за четыре недели — быстрейшая переоценка кредита в истории, на фоне шока, давшего и кратчайшую рецессию.
  nfci:
    title: "NFCI"
    desc: "Еженедельный индекс финансовых условий ФРБ Чикаго — 105 индикаторов в одном числе."
    body: |
      Национальный индекс финансовых условий, публикуемый еженедельно Федеральным резервным банком Чикаго, сводит 105 измерений финансовой активности США — денежные рынки, рынки долга и акций, банковскую систему — в единый индекс, где ноль соответствует средним условиям с 1971 года.
      ## Как читать
      Положительные значения — условия жёстче средних: шире спреды, жёстче кредит, выше волатильность. Отрицательные — мягче средних. Устойчивые положительные значения сопровождали каждый кредитный спад выборки: индекс ушёл в устойчивый плюс в 2007-м, вертикально вспыхнул в 2008-м и коротко взлетел в марте 2020-го.
      ## Почему важен
      Кредит — канал трансмиссии между финансами и реальной экономикой: когда условия ужесточаются, заимствования, найм и инвестиции следуют с лагом. NFCI ловит этот канал раньше и полнее любого отдельного спреда — поэтому стоит в вершине финансового блока монитора.
      > **Факт:** Индекс считается фильтром в духе Калмана: веса индикаторов зависят от корреляции с общим состоянием — волатильные ряды автоматически вносят меньше, что сохраняет читаемость NFCI в шумные недели.
  leading_vs_coincident:
    title: "Опережающие и совпадающие сигналы"
    desc: "Разница между прогнозом рецессии и детекцией уже идущей — и зачем нужны оба типа."
    body: |
      Индикаторы рецессии делятся на две принципиально разные задачи. Опережающие сигналы срабатывают за месяцы до спада — они прогнозируют. Совпадающие (nowcast) подтверждают уже идущую рецессию — они датируют. Путаница между ними — самая частая методологическая ошибка в наблюдении за рецессиями.
      ## Зачем оба
      Чисто прогнозная панель слепа к немоделируемым шокам: никакая кривая не предсказывала COVID-19. Чисто nowcast-панель не даёт запаса времени — к моменту срабатывания рецессия уже началась. Монитор держит их раздельными блоками: прогнозные сигналы двигают композитный скор, nowcast подтверждают или ветируют вопрос «а мы уже внутри?».
      ## Примеры
      Опережающие: кривая доходности (за 6–18 месяцев), строительные пермиты (часто 12+ месяцев), кредитные спреды, банковские стандарты кредитования. Совпадающие: правило Сама, вероятности Шове–Пайгер, первичные заявки — быстрые, в реальном времени, но описывающие настоящее, а не будущее.
      > **Факт:** Безупречный рекорд правила Сама — именно по детекции начала; экономисты, называющие его «предиктором рецессии», описывают его неверно — ровно та категорийная ошибка, которую разделение блоков и предотвращает.
  data_revisions:
    title: "Ревизии данных и винтажи"
    desc: "Почему вчерашние экономические данные меняются — и почему честные бэктесты используют ту версию, которую реально видели."
    body: |
      Экономическая статистика не застывает при публикации: payrolls ревизуются месяцами, у ВВП три официальные оценки плюс ежегодные перерасчёты, даже ряды безработицы рестейтят. Число в базе сегодня часто материально отличается от числа, опубликованного в тот день.
      ## Ловушка взгляда вперёд
      Бэктест, спрашивающий «сработал бы сигнал?» на сегодняшних переписанных данных, слегка жульничает — он отвечает информацией, которой ни у кого тогда не было. Исследования показывали: индикаторы выглядят заметно точнее на переписанной истории, чем были в реальном времени.
      ## Винтажи как решение
      ALFRED (архивный близнец FRED) хранит каждую опубликованную версию ряда с датой выхода — «винтаж». Монитор хранит винтажи для своих рядов, позволяя анализу эпизодов и бэктестам реплеить ровно то, что было познаваемо на конкретную дату. Это разница между «что мы знали тогда» и «что знаем сейчас».
      > **Факт:** Исследования данных реального времени ФРБ Филадельфии показали: ранние выпуски ВВП в реальном времени пропускали целые рецессии NBER — переписанная история в учебниках чище той, что видели политики.
  composite_score:
    title: "Композитный скор"
    desc: "Как состояния отдельных сигналов складываются в оценку риска рецессии на 12 месяцев."
    body: |
      Каждый сигнал панели находится в одном из четырёх состояний: ok, watch, warning, critical. Композитный скор — взвешенная сумма активных состояний: watch даёт пол-очка, warning — очко, critical — полтора, умноженные на собственный вес сигнала в панели.
      ## От скора к бакету риска
      Скор отображается на четыре бакета, откалиброванные на истории 1967–2026: low (меньше 5, примерно базовый уровень ~15%), elevated (5–9), high (9–13), severe (13+). Границы выбраны так, чтобы старшие бакеты соответствовали ощутимо более высокой исторической частоте рецессий — читать нужно бакет, а не голое число.
      ## Почему сумма, а не модель
      Обученная модель (логит/пробит) выжала бы из панели чуть больше точности — но её коэффициенты непрозрачны и нестабильны вне выборки. Взвешенная сумма полностью аудируема: каждое очко скора можно приписать конкретному сигналу — для публичного монитора это важнее долей процента точности.
      > **Факт:** В скор сознательно не включены ряды акций и опросы настроений — каждый вход это измерение реальной активности или кредита, исходя из принципа: рецессии подтверждаются в экономике, а не в ожиданиях.

