bot:
  start: |
    👋 Добро пожаловать в US Recession Chance.

    Я слежу за опережающими индикаторами рецессии в США (кривая доходности, кредитные спреды, рынок труда, жильё) и присылаю уведомления при смене их состояния.

    /status — текущие сигналы и композитный риск
    /guide — подробный гайд по терминам и расчётам
    /signals — выбор отслеживаемых сигналов
    /settings — уведомления, язык, доставка
    /analytics — статистика по сигналам
    /digest HH:MM — своё время дайджеста
    /plan — подписка
    /terms — условия использования
    /paysupport — поддержка по платежам

    ⚠️ Только информационные данные — не инвестиционная рекомендация. Исторические частоты не гарантируют будущих результатов.
  disclaimer_short: "Только информационные данные — не инвестиционная рекомендация."
  guide: |
    📖 Гайд — как это работает

    🔹 Данные
    Макропоказатели США из FRED (ФРБ Сент-Луиса), обновляются по расписанию релизов. Датировка рецессий — по хронологии NBER.

    🔹 Сигналы и состояния
    Каждый индикатор сравнивается с исторически значимыми порогами:
    • норма — вне зоны риска
    • наблюдение — раннее ухудшение
    • предупреждение — уровень, после которого рецессии наступали статистически чаще
    • критично — глубокое ухудшение
    Смена состояния = событие. «Историческая точность» — доля эпизодов сигнала, после которых рецессия началась за 12 мес (n — число эпизодов). «Мало истории» — ряд покрывает меньше ~5 рецессий, статистика ненадёжна.

    🔹 Композитный скор
    score = Σ (вес сигнала × множитель состояния)
    Множители: наблюдение 0.5 · предупреждение 1.0 · критично 1.5
    Бакеты: <5 — НИЗКИЙ (<15%) · 5–9 — ПОВЫШЕННЫЙ (≈35–60%) · 9–13 — ВЫСОКИЙ (≈40–65%) · ≥13 — СИСТЕМНЫЙ (исторически редко). Проценты — калибровка бэктестом на 1967–2026.

    🔹 Оценка модели
    Pooled logit, обучена на 1983–2025: вероятность НАЧАЛА рецессии за ближайшие 12 мес. Предикторы: спред 10Y–3M, NFCI, CFNAI-MA3, заявки на пособие г/г, разрешения на стройку г/г, 3-мес. изменение безработицы. Это главное число; скор — поясняющий контекст. Безусловная базовая ставка ~16%.

    🔹 Nowcast vs прогноз
    Прогнозные сигналы отвечают «будет ли рецессия за 12 мес». Nowcast (правило Сэм, Chauvet–Piger) — «не началась ли она уже»: подтверждают начало почти без опережения и выводятся отдельной секцией.

    🔹 Источники — проверьте сырые данные на FRED:
    fred.stlouisfed.org/series/UNRATE · /SAHMREALTIME · /T10Y3M · /ICSA · /PERMIT · /CFNAI — полный список рядов: /analytics

    🔹 Тарифы
    Free: дневной + недельный дайджест.
    Plus: мгновенные алерты переходов и nowcast, уровень «наблюдение», выбор сигналов, свой порог скора, /analytics, /now, /episodes, своё время дайджеста, отключение дайджестов — /plan.

    ⚠️ Только информационные данные — не инвестиционная рекомендация. Исторические частоты не гарантируют будущих результатов.
