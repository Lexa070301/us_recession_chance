  method_data_text: |
    Все индикаторы — публичные ряды FRED (ФРБ Сент-Луиса); у каждого сигнала есть ссылка на источник.
    Датировка рецессий — по хронологии NBER. Лаги публикаций учтены явно, а винтажи ALFRED
    хранят аудируемую запись того, как данные выглядели в каждый момент времени.
  method_intro: |
    Сигналы оцениваются по исторически значимым порогам из рядов FRED.
    Смена состояния — это событие; композитный скор взвешивает активные состояния
    и отображается на бакеты риска, откалиброванные на истории 1967–2026.
    Nowcast-сигналы отвечают «уже началась ли рецессия» — они подтверждают начало,
    а не прогнозируют его.
    Данные ревизионно-честные: винтажи ALFRED отделяют «что мы знали тогда»
    от «что знаем сейчас» — бэктесты идут на as-of данных, а не на переписанной истории.
