  watch: "наблюдение"
  warning: "предупреждение"
  critical: "критично"

bucket:
  low: "НИЗКИЙ"
  elevated: "ПОВЫШЕННЫЙ"
  high: "ВЫСОКИЙ"
  severe: "СИСТЕМНЫЙ"

state_change:
  cleared: "снят"

event:
  title: "{{icon}} {{name}}"
  value: "Значение: {{value}}"
  since: "Действует с {{since}}"
  hist: "История: рецессия за 12 мес наступала после {{precision}}% эпизодов (n={{episodes}}, {{sample}})"
  hist_short: "Историческая точность: {{precision}}% ({{sample}})"
  hist_insufficient: "Мало истории ({{sample}}) — статистика ненадёжна"
  transition: "Статус: {{label}}"

composite:
  title: "📊 Композитный риск рецессии за 12 мес"
  line: "Скор {{score}} → {{bucket}} ({{prob}})"
