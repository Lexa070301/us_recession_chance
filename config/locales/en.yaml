  article:
    r1969:
      title: "The 1969–70 Recession"
      body: |
        The recession of 1969–70 was a deliberately engineered slowdown — the first post-war episode where policy openly traded growth for price stability. Through 1968–69 the Federal Reserve tightened aggressively to cool the inflation built up by Vietnam-era deficit spending, while fiscal policy swung from a $5.2B deficit to a ~$10B surplus — an enormous demand withdrawal in a single year.
        ## How it unfolded
        Growth stalled in late 1969 and the economy contracted through most of 1970. Unemployment climbed from a 15-year low of 3.4% to about 6%, yet the downturn stayed mild by every aggregate measure — services and consumption held up while goods production and housing took the hit.
        ## Why it matters for signals
        It is the cleanest example of an interest-rate-driven recession: the curve tightened well before activity rolled over, rewarding the leading indicators that watch financial conditions rather than labor. The yield curve had already inverted during the 1966 credit crunch — which produced a slowdown but no recession — making the era the canonical lesson that an inversion is a warning, not a verdict.
        > **Fact:** The 1969–70 downturn lasted 11 months (Dec 1969 – Nov 1970). Inflation barely responded — it fell only marginally — foreshadowing the far harsher medicine the Fed would need in the 1980s.
    r1973:
      title: "The 1973–75 Recession"
      body: |
        The 1973–75 recession was the deepest US downturn between the 1930s and 2008 — a collision of a demand boom, a supply shock, and the collapse of price controls. Nixon's 1971 wage-price freeze had bottled inflation artificially; when controls loosened in 1973, prices surged just as the OPEC embargo of October 1973 quadrupled oil prices in three months.
        ## Two stages of decline
        NBER analysis splits the episode in two. From November 1973 to autumn 1974 the economy shrank moderately — mostly a supply-constraint story, with gasoline queues and materials shortages throttling output. After October 1974 demand itself collapsed: industrial production, employment, and real income all broke down together, and unemployment raced to 9% by May 1975.
        ## The signal record
        Housing indicators warned earliest — starts and permits rolled over in 1973, well before the NBER peak. The yield curve had inverted in 1973, and claims accelerated through 1974. Notably, this is the episode that created the word every forecaster fears: stagflation — prices rising even as output fell, breaking the simple Phillips-curve logic.
        > **Fact:** The S&P 500 lost 48% peak-to-trough (Jan 1973 – Oct 1974), its worst decline since the Great Depression. The recession lasted 16 months — the longest post-war contraction until 2007–09 tied it.
    r1980:
      title: "The 1980 Recession"
      body: |
        The 1980 recession was Paul Volcker's opening shot against inflation — and it remains one of the strangest on record because part of the damage was self-inflicted by credit controls. In October 1979 the Fed had switched to targeting bank reserves, letting the funds rate float; by April 1980 it stood at 17.6%. On top of that, President Carter invoked the Credit Control Act in March 1980, asking lenders to restrain consumer credit.
        ## A demand shock on demand
        Consumers responded faster than anyone expected: credit card spending froze almost overnight. Manufacturing shed 1.1 million jobs in months, autos lost a third of their workforce, and housing froze. Yet the recession lasted just six months — once controls were lifted in July, pent-up demand snapped back so quickly that the recovery barely looks like one on charts.
        ## Why it matters for signals
        Financial and credit signals dominated: the curve inverted deeply through 1979, credit conditions tightened on their own before the controls, and housing led the decline by months. Labor signals confirmed late — unemployment peaked at 7.8% in July 1980, essentially at the trough itself, a reminder that the Sahm-style signals timestamp onset, not forecast.
        > **Fact:** The 1980 downturn is the shortest peacetime recession on the modern NBER list — six months. It is also the only one partly caused by a credit freeze the government requested on purpose.
    r1981:
      title: "The 1981–82 Recession"
      body: |
        Barely a year after the 1980 recovery began, the economy fell back in — the second leg of the famous double dip, and the most painful disinflation in modern Fed history. Volcker kept the funds rate near 19% and the prime rate above 21% through 1981; nothing in the credit economy could function at those prices for long.
        ## The price of credibility
        Manufacturing and construction hollowed out — the Rust Belt label dates from this period — and unemployment rose to 10.8% in late 1982, a post-war record that still stands. The recession ran 16 months, matching 1973–75 as the longest post-war contraction at the time. In return, inflation collapsed from double digits to under 4% within a year of the trough.
        ## The signal record
        Nearly every leading indicator warned in sequence: the curve had inverted through 1980–81, permits and starts fell from early 1981, credit spreads widened, and claims built through the year. It is the textbook case of signals stacking — by mid-1981 almost the entire panel was active, which is what a severe-band reading looks like in practice.
        > **Fact:** Unemployment stayed above 10% for ten consecutive months — a duration of double-digit joblessness the US has not seen since, not even in 2009 (10% for one month) or 2020 (14.7% for one month).
    r1990:
      title: "The 1990–91 Recession"
      body: |
        The 1990–91 recession combined three shocks that rarely arrive together: a Fed tightening cycle (1988–89), a domestic credit crunch from the Savings & Loan collapse, and an oil spike after Iraq invaded Kuwait in August 1990. GDP contracted only mildly — but the recovery became famous for what didn't happen: jobs didn't come back.
        ## The credit-crunch recession
        Hundreds of thrift institutions were failing, commercial real estate was underwater, and regulators had tightened lending standards simultaneously — banks simply stopped lending. When oil jumped from $17 to $36 per barrel in three months, consumer and business confidence, already fragile, broke. Unemployment rose through the recession's end and kept climbing until June 1992.
        ## The signal record
        The yield curve never fully inverted before this recession — one of its cleanest historical misses — while credit and housing signals (SLOOS-style tightening, permits declining through 1988–89) caught the deterioration early. It is the canonical argument for a multi-signal panel: the curve blinked, but credit conditions told the truth.
        > **Fact:** The 'jobless recovery' was coined here: output resumed growth in April 1991 but unemployment peaked 15 months later, in June 1992 — a lag long enough to arguably cost George H.W. Bush re-election.
    r2001:
      title: "The 2001 Recession"
      body: |
        The 2001 recession was an investment bust, not a consumer one. The Nasdaq peaked in March 2000 and would ultimately lose 78% of its value; the capital-expenditure mania of the late 1990s — fiber, servers, dot-com payrolls — unwound through 2000–01 as profits evaporated. GDP barely fell: the recession showed up in business spending and jobs, not consumer demand.
        ## An interrupted downturn
        The Fed cut rates from 6.5% to 1.75% within the year, and the economy was stabilizing when September 11 hit — freezing travel, insurance, and confidence for a quarter and extending the contraction to 8 months. Corporate scandals (Enron in late 2001, WorldCom in 2002) poisoned equity sentiment well past the official trough.
        ## The signal record
        Inversion warned earliest — the curve was inverted through most of 2000. Equity-linked stress arrived before labor did: durable orders and temp help declined through 2000, while claims and the Sahm rule confirmed around the official March 2001 peak. Another jobless recovery followed — unemployment did not peak until June 2003, 19 months after the recession ended.
        > **Fact:** Measured by GDP decline this was the mildest post-war recession — real output never fell in two consecutive quarters. Measured by payrolls, 2.7 million jobs vanished; the labor market's pain far exceeded what output data suggested.
    gfc:
      title: "The Great Recession (2007–09)"
      body: |
        The 2007–09 recession was the deepest US downturn since the Great Depression: 18 months long, a housing bust metastasizing into a global banking crisis. Home prices had peaked in 2006, subprime losses were surfacing through 2007, and the NBER peak — December 2007 — predates the drama most people remember.
        ## Three acts
        Act one was a slow squeeze: housing indicators deteriorated through 2006–07 while equities kept rising. Act two was the financial heart attack — Bear Stearns in March 2008, then Lehman's collapse on September 15, 2008, which turned a housing recession into a global panic; credit markets froze within days. Act three was the real-economy cascade: world trade fell off a cliff, payrolls shed 700,000+ jobs per month in early 2009, and unemployment doubled to 10%.
        ## The signal record
        This is the panel's strongest historical performance: housing permits and starts warned from mid-2006 — roughly 18 months before the peak — credit conditions tightened through 2007, and the NFCI reached critical levels in 2008 before Lehman. The yield curve had inverted in 2006–07. Almost every forecast signal was active by the official start; the composite-style reading would have been in the severe band.
        > **Fact:** The Fed's policy response invented the modern playbook — rates to zero for the first time ever (Dec 2008), plus quantitative easing. The expansion that followed lasted 128 months, the longest in US history, until COVID ended it.
    covid:
      title: "The COVID-19 Recession (2020)"
      body: |
        The COVID recession holds two records at once: the shortest recession in the NBER chronology — just two months, February to April 2020 — and the sharpest single-month deterioration ever recorded. Unemployment jumped from a 50-year low of 3.5% to 14.7% in eight weeks; Q2 GDP fell at an annualized rate near 30%.
        ## A recession by decree
        Every prior recession emerged from economic imbalances; this one was mandated by public-health shutdowns. That made traditional leading indicators nearly useless — no yield curve, spread, or housing series could foresee a pandemic — and elevated the nowcast block: the Sahm rule triggered in April 2020 in real time, faster than any GDP-based confirmation could have.
        ## The signal record
        Claims data told the story fastest: initial claims printed 6.6 million in a single week in late March — ten times the previous record — making this the episode where high-frequency labor data earned its keep. Financial stress spiked and was suppressed within weeks by the largest monetary-fiscal response in history, which is also why the recovery was the fastest on record.
        > **Fact:** The NBER committee declared the recession's start in June 2020 but dated its trough as April — meaning the economy was already recovering before the recession was officially announced. Signal latency matters more than ever in fast cycles.
    scare2324:
      title: "The 2023–24 Inversion Scare"
      body: |
        From July 2022 the 2-year/10-year Treasury curve was continuously inverted — eventually passing 624 days to become the longest inversion on record, exceeding the 1978 run. The 10Y–3M probit model implied recession odds near 77% by May 2023. Every recession playbook said the downturn was due in 2023. It never came.
        ## Why the signal failed
        The inversion's mechanism — inverted curves squeeze bank lending margins, choking credit — was blunted by a deposit glut: banks were paying near-zero on deposits, so margins stayed healthy and credit kept flowing. Meanwhile fiscal stimulus, locked-in low mortgages, and a labor supply shock kept demand resilient. The curve measured rate expectations accurately; it was the transmission channel that broke.
        ## What it teaches
        A single-signal monitor would have flashed red for two years straight and been wrong the whole time — the strongest possible argument for a composite panel. Credit spreads stayed calm, NFCI never sustained stress, and labor demand cooled without collapsing. The episode is included here deliberately: a monitor that only publishes its hits is marketing, not methodology.
        > **Fact:** The Sahm rule did trigger in August 2024 — its first false-positive-style firing — driven by labor-force growth rather than layoffs. Even the 'flawless' signals miss occasionally; that is why the composite asks for corroboration instead of conviction.
  signal_page:
    yield_curve_inversion: "The 10-year minus 3-month Treasury spread is the single most-studied recession predictor: short rates above long rates mean the market expects cuts ahead — historically because growth is weakening. It has preceded every US recession since the late 1960s, with a typical lead of 6–18 months, though it flashed false alarms in 1966–67 and 2023–24."
    curve_10y2y_inversion: "The 10-year/2-year pair is the market's most-watched spread and usually inverts later than the 10Y–3M. It serves here as corroboration rather than a primary trigger — two independent curve measures agreeing carries more weight than either alone."
    yield_curve_resteepening: "The dangerous moment historically is not the inversion itself but the rapid re-steepening afterwards — the curve un-inverts because the Fed starts cutting as the economy cracks. In 1990, 2001, 2007 and 2020 the re-steepening clustered around recession onset, making it a short-lead confirmation signal."
    nyfed_recession_prob: "The New York Fed's published probit model converts the 10Y–3M spread directly into a 12-month recession probability — the same spread we track, turned into a number. It is included as a signal in its own right and doubles as the basis for this site's model line."
    nfci_tightening: "The Chicago Fed's NFCI compresses 105 financial series — money markets, credit, leverage — into a weekly index where zero means average conditions. Sustained positive readings have accompanied every credit-driven downturn since 1973, often tightening before labor data reacts."
    stlfsi_stress: "The St. Louis Fed stress index aggregates 18 series across yields, spreads, and volatility into one stress gauge. It is more volatile than NFCI but reacts faster — useful as an early financial-panic detector, especially around events like March 2020."
    hy_spread: "High-yield spreads measure the premium junk-rated borrowers pay over Treasuries. Widening means markets are repricing default risk — historically rising sharply before and during every recession, and one of the fastest credit-stress indicators available weekly."
    bbb_spread: "The BBB option-adjusted spread is the investment-grade counterpart: the cheapest borrowing tier above junk. Broadening of the BBB premium confirms that stress is escaping the speculative tier into mainstream corporate credit — a corroborating signal, not a leading one on its own."
    sloos_tightening: "The Fed's Senior Loan Officer survey asks banks directly whether they are tightening standards on commercial and industrial loans. Bankers restrict credit before borrowers visibly weaken — making SLOOS one of the few surveys that genuinely leads, although it publishes only quarterly."
    permits_decline: "Building permits lead actual construction by months, and construction leads the cycle — housing has entered nearly every US recession first, sometimes two years early (2006 vs the 2007 peak). A sustained YoY decline is one of the slowest but most reliable warnings on the panel."
    housing_starts_decline: "Housing starts confirm the permits signal in real activity: actual ground-breaking falling year-over-year means builders see unsold demand ahead. Housing is the most interest-rate-sensitive sector, which is why it moves first when policy tightens."
    durable_orders_decline: "Durable goods orders capture business and consumer commitment to big-ticket purchases — machinery, vehicles, appliances. They are noisy month-to-month but the year-over-year trend turns negative early in slowdowns as firms postpone investment first."
    claims_trend: "Weekly initial jobless claims are the highest-frequency labor indicator that exists — a rising four-week average means layoffs are starting in real time, weeks before payrolls confirm it. It is the earliest real-time labor signal on the panel."
    continued_claims_rise: "Continued claims measure how long the unemployed stay unemployed — rising insured unemployment means laid-off workers are not finding new jobs, a more serious deterioration than layoffs alone. It rises from its cycle trough as the labor market loses absorptive capacity."
    temp_help_decline: "Firms cut temporary staff before permanent staff — temp help is the labor market's shock absorber and historically turns down months before payrolls. A sustained YoY decline has preceded every recession for which the series exists."
    jolts_flows: "JOLTS tracks job openings and quits: openings falling means labor demand cooling, while quits falling means workers no longer trust outside opportunities. Both deteriorating together captures labor-market confidence cracking from both sides."
    cfnaid_weak: "The Chicago Fed National Activity Index averages 85 monthly indicators across production, employment, consumption, and housing into a single diffusion measure. A 3-month average below −0.7 has historically coincided with the economy operating well below trend — broad weakness rather than one sector failing."
    indpro_decline: "Industrial production is one of the four coincident series NBER itself consults when dating recessions. A year-over-year decline is nearly a coincident signal — it arrives late as a warning but is highly reliable as confirmation that the slowdown is real."
    sahm_rule: "The Sahm rule fires when the 3-month average unemployment rate sits 0.5pp above its 12-month low — a near-perfect real-time recession-onset detector designed by Claudia Sahm. Crucially it timestamps the start of a recession rather than forecasting one; it belongs to the nowcast block and carries no forecast weight."
    chauvet_piger: "The Chauvet–Piger smoothed recession probabilities estimate the likelihood that the economy is currently in recession, using the same four coincident series NBER weighs. Values that jump and stay elevated have historically aligned with the official dating — the market's best 'are we in one now' gauge."
    sahm_states: "An experimental regional nowcast: counting how many individual states have crossed their own Sahm-rule trigger. Recessions rarely start uniformly — state-level diffusion can reveal a downturn broadening before the national rate trips, at the cost of noisier signals."
