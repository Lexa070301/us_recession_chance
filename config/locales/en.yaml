    ALFRED vintages keep an auditable record of what the data looked like at each point in time.
  method_intro: |
    Signals are evaluated against historically meaningful thresholds from FRED series.
    A state change is an event; the composite score weights active states and maps to
    risk buckets calibrated on 1967–2026 history. Nowcast signals detect a recession
    that may already be underway — they confirm onset, not forecast it.
    Data is release-aware: ALFRED vintages let us distinguish "what we knew then"
    from "what we know now" — backtests use as-of data, not revised history.
