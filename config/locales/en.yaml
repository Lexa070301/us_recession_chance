bot:
  start: |
    👋 Welcome to US Recession Chance.

    I track leading US recession indicators (yield curve, credit spreads, labor market, housing) and alert you when they change state.

    /status — current signals & composite risk
    /guide — detailed guide to terms & calculations
    /signals — choose which signals to follow
    /settings — alerts, language, delivery
    /analytics — per-signal statistics
    /digest HH:MM — custom digest time
    /plan — subscription
    /terms — terms of service
    /paysupport — payment support

    ⚠️ Informational and educational data only — not investment advice. Historical frequencies do not guarantee future results.
  disclaimer_short: "Informational data only — not investment advice."
  guide: |
    📖 Guide — how this works

    🔹 Data
    US macro indicators from FRED (St. Louis Fed), updated on release schedules. Recession dating follows the NBER chronology.

    🔹 Signals & states
    Each indicator is compared against historically meaningful thresholds:
    • ok — outside the risk zone
    • watch — early deterioration
    • warning — a level historically followed by recessions more often
    • critical — deep deterioration
    A state change = an event. "Historical accuracy" = the share of the signal's episodes after which a recession began within 12 months (n = episode count). "Limited history" = the series covers fewer than ~5 recessions, so stats are unreliable.

    🔹 Composite score
    score = Σ (signal weight × state multiplier)
    Multipliers: watch 0.5 · warning 1.0 · critical 1.5
    Buckets: <5 — LOW (<15%) · 5–9 — ELEVATED (≈35–60%) · 9–13 — HIGH (≈40–65%) · ≥13 — SYSTEMIC (historically rare). Probabilities are backtest-calibrated on 1967–2026.

    🔹 Model estimate
    A pooled logit fitted on 1983–2025: probability of a recession STARTING within 12 months. Predictors: 10Y–3M spread, NFCI, CFNAI-MA3, jobless claims YoY, building permits YoY, 3-month unemployment change. This is the headline number; the score is supporting context. Unconditional base rate ~16%.

    🔹 Nowcast vs forecast
    Forecast signals answer "will a recession come within 12m". Nowcast signals (Sahm rule, Chauvet–Piger) answer "has one already started" — they confirm onset with almost no lead and are shown in a separate section.

    🔹 Sources — verify raw data on FRED:
    fred.stlouisfed.org/series/UNRATE · /SAHMREALTIME · /T10Y3M · /ICSA · /PERMIT · /CFNAI — full series list: /analytics

    🔹 Plans
    Free: daily + weekly digest.
    Plus: instant transition & nowcast alerts, watch-level signals, signal selection, custom score threshold, /analytics, /now, /episodes, custom digest time, digest toggles — /plan.

    ⚠️ Informational data only — not investment advice. Historical frequencies do not guarantee future results.
