version: 1

# Signal catalog. Evaluators recompute state deterministically from a
# series' own history + the previously stored state (levels hysteresis via
# exit_below/exit_above); the engine diffs vs stored state and emits
# SignalEvent only on transitions (episode dedupe).
#
# yoy thresholds are PERCENT change YoY (e.g. critical: -10 = −10% YoY).
#
# hist = static statistics from literature/backtest (see scripts/histStats.md).
#   precision: share of signal EPISODES followed by recession within 12m
#   recall:    share of recessions preceded by the signal
#   insufficient_history: fewer than ~5 recessions covered by the series

signals:
  # =====================================================================
  # FINANCIAL — yield curve & conditions
  # =====================================================================
  - key: yield_curve_inversion
    block: financial
    weight: 2
    input: { key: yield_10y3m, transform: value }
    evaluator:
      type: episode_duration
      params:
        {
          op: "<",
          threshold: 0,
          warn_periods: 10,
          critical_periods: 60,
          exit_periods: 5,
        }
    hist:
      sample: "1982–2026, T10Y3M series; measured 2026-10"
      episodes: 5
      recessions_covered: 4
      precision: 0.40
      recall: 1.0
      median_lead_months: 9
      note: "Literature (reconstructed 1962+) is stronger: ~0.78 precision incl. 1966 FP only. Our rule needs ≥10 obs below 0 — misses brief dips; 2022–25 inversion still unresolved (no recession through 2026-09 — possible 2nd-ever FP)."

  - key: curve_10y2y_inversion
    block: financial
    weight: 1
    input: { key: yield_10y2y, transform: value }
    evaluator:
      type: episode_duration
      params:
        {
          op: "<",
          threshold: 0,
          warn_periods: 10,
          critical_periods: 60,
          exit_periods: 5,
        }
    hist:
      sample: "1976–2026, measured 2026-10"
      episodes: 6
      recessions_covered: 6
      precision: 0.0
      recall: 0.83
      note: "Precision@12m = 0 because 10y–2y inverts >12m before recession starts (median lead ~15m). Recall is real but horizon is longer — corroborating signal only."

  - key: yield_curve_resteepening
    block: financial
    weight: 1
    min_event_gap_hours: 72
    input: { key: yield_10y3m, transform: value }
    evaluator:
      type: change_over_period
      params: { periods: 63, op: ">", warn: 1.0, ref_below: 0 }
    hist:
      sample: "1982–2026"
      insufficient_history: true
      note: "Bear steepening OUT OF INVERSION (ref < 0) historically clusters near recession onset; steepening from flat doesn't count — fixed after v1 backtest showed 0.15 precision on plain Δ>1.0."

  - key: nyfed_recession_prob
    block: composite
    weight: 2
    input: { key: yield_10y3m, transform: nyfed_prob }
    evaluator:
      type: levels
      params:
        levels:
          - { state: critical, op: ">", threshold: 40 }
          - { state: warning, op: ">", threshold: 30 }
        exit_below: 25
    hist:
      sample: "1982–2026, measured 2026-10"
      episodes: 5
      recessions_covered: 4
      precision: 0.4
      recall: 1.0
      median_lead_months: 8
      note: "NY Fed track record (1960+, prob>40%): missed only Oct-1966. Our T10Y3M starts 1982; 2022–25 episode unresolved → measured precision drags. Trigger level >30% picks up brief LTCM-era dips."

  - key: nfci_tightening
    block: financial
    weight: 2
    input: { key: nfci, transform: value }
    evaluator:
      type: levels
      params:
        levels:
          - { state: critical, op: ">", threshold: 1.0 }
          - { state: warning, op: ">", threshold: 0.5 }
          - { state: watch, op: ">", threshold: 0.0 }
        exit_below: -0.1
    hist:
      sample: "1971–2026, measured 2026-10"
      recessions_covered: 7
      precision: 0.25
      recall: 1.0
      median_lead_months: 8
      note: "NFCI>0 historically overlaps recessions but fires in stress episodes too (precision ~0.25 at our thresholds) — confirmatory, not standalone."

  - key: stlfsi_stress
    block: financial
    weight: 1
    input: { key: stlfsi, transform: value }
    evaluator:
      type: levels
      params:
        levels:
          - { state: critical, op: ">", threshold: 1.0 }
          - { state: warning, op: ">", threshold: 0.5 }
          - { state: watch, op: ">", threshold: 0.0 }
        exit_below: -0.1
    hist:
      sample: "1994–2026, measured 2026-10"
      insufficient_history: true
      recessions_covered: 3
      precision: 0.18
      recall: 1.0
      median_lead_months: 6
      note: "~3 recessions covered; many stress episodes without recession."

  # =====================================================================
  # CREDIT
  # =====================================================================
  - key: hy_spread
    block: credit
    weight: 2
    min_event_gap_hours: 72
    input: { key: hy_oas, transform: value }
    evaluator:
      type: any_of
      branches:
        - type: levels
          params:
            levels:
              - { state: critical, op: ">", threshold: 8.0 }
              - { state: warning, op: ">", threshold: 5.0 }
            exit_below: 4.5
        - type: change_over_period
          params: { periods: 63, op: ">", warn: 1.0 }
    hist:
      sample: "API limited (~3y) — ICE BofA licence"
      recessions_covered: 3
      insufficient_history: true
      precision: 0.6
      recall: 1.0
      median_lead_months: 6
      note: "Literature: caught 2001/2008/2020, flashed 2011/2015–16/2022. FRED API serves only ~3y of BAML series — no full backtest possible."

  - key: bbb_spread
    block: credit
    weight: 1
    min_event_gap_hours: 72
    input: { key: bbb_oas, transform: value }
    evaluator:
      type: any_of
      branches:
        - type: levels
          params:
            levels:
              - { state: warning, op: ">", threshold: 2.5 }
            exit_below: 2.2
        - type: change_over_period
          params: { periods: 63, op: ">", warn: 0.5 }
    hist:
      sample: "API limited (~3y) — ICE BofA licence"
      insufficient_history: true
      note: "BBB proxy for investment-grade/excess-bond-premium channel (FEDS OOS work). FRED API serves only ~3y."

  - key: sloos_tightening
    block: credit
    weight: 2
    input: { key: sloos_ci, transform: value }
    evaluator:
      type: levels
      params:
        levels:
          - { state: critical, op: ">", threshold: 40 }
          - { state: warning, op: ">", threshold: 20 }
          - { state: watch, op: ">", threshold: 0 }
        exit_below: -5
    hist:
      sample: "1990–2026, quarterly, measured 2026-10"
      recessions_covered: 4
      insufficient_history: true
      precision: 0.33
      recall: 1.0
      median_lead_months: 4
      note: "Net % banks tightening C&I loans; led all covered recessions but FPs in stress episodes; only 4 recessions."

  # =====================================================================
  # HOUSING / INVESTMENT
  # =====================================================================
  - key: permits_decline
    block: housing
    weight: 1
    input: { key: permits, transform: value }
    evaluator:
      type: yoy
      params: { op: "<", threshold: 0, warn: 3, critical: -10 }
    hist:
      sample: "1966–2026, measured 2026-10"
      episodes: 16
      recessions_covered: 8
      precision: 0.31
      recall: 1.0
      median_lead_months: 7
      note: "Permits YoY% <0 fires in every slowdown incl. mid-cycle; critical at −10%. Remeasured after yoy %-fix — precision 0.11→0.31."

  - key: housing_starts_decline
    block: housing
    weight: 1
    input: { key: housing_starts, transform: value }
    evaluator:
      type: yoy
      params: { op: "<", threshold: -10, warn: 2 }
    hist:
      sample: "1966–2026, measured 2026-10"
      episodes: 11
      recessions_covered: 8
      precision: 0.36
      recall: 0.75
      median_lead_months: 4
      note: "YoY% <−10% also fires in housing downturns w/o recession (2018, 2023). Remeasured after yoy %-fix — precision 0.18→0.36, recall 1.0→0.75."

  - key: durable_orders_decline
    block: housing
    weight: 1
    input: { key: dg_orders, transform: value }
    evaluator:
      type: yoy
      params: { op: "<", threshold: 0, warn: 3 }
    hist:
      sample: "1992–2024"
      insufficient_history: true
      note: "Proxy for ISM new orders (licensed); volatile — streak required."

  # =====================================================================
  # LABOR
  # =====================================================================
  - key: claims_trend
    block: labor
    weight: 1
    input: { key: icsa, transform: value }
    evaluator:
      type: any_of
      branches:
        - type: streak
          input: { key: icsa, transform: ma4 }
          params: { direction: up, warn_count: 8, critical_count: 12 }
        - type: rise_from_trough
          input: { key: icsa, transform: ma4 }
          params: { window: 52, rise_pct: 15, critical_pct: 25 }
    hist:
      sample: "1967–2026, measured 2026-10"
      recessions_covered: 8
      precision: 0.2
      recall: 1.0
      median_lead_months: 6
      note: "Short horizon (1–6m) — earliest real-time labor signal; noisy alone (strikes, reopenings)."

  - key: continued_claims_rise
    block: labor
    weight: 1
    input: { key: ccsa, transform: value }
    evaluator:
      type: rise_from_trough
      params: { window: 104, rise_pct: 10, critical_pct: 20 }
    hist:
      sample: "1967–2026, measured 2026-10"
      recessions_covered: 8
      precision: 0.35
      recall: 1.0
      median_lead_months: 5

  - key: temp_help_decline
    block: labor
    weight: 1
    input: { key: temp_help, transform: value }
    evaluator:
      type: yoy
      params: { op: "<", threshold: 0, warn: 3 }
    hist:
      sample: "1990–2024"
      insufficient_history: true
      note: "Firms cut temps before permanent layoffs; declined before 2001, 2008, 2020 and in 2022–24."

  - key: jolts_flows
    block: labor
    weight: 1
    input: { key: job_openings, transform: value }
    evaluator:
      type: all_of
      branches:
        - type: streak
          input: { key: job_openings, transform: value }
          params: { direction: down, warn_count: 2 }
        - type: streak
          input: { key: quits_rate, transform: value }
          params: { direction: down, warn_count: 2 }
    hist:
      sample: "2000–2026"
      insufficient_history: true
      note: "JOLTS covers only ~3 recessions; measured episodes START inside recessions (2009-01, 2020-05) — coincident deterioration, not a lead. Weight kept for state confirmation."

  # =====================================================================
  # COMPOSITE / REAL ACTIVITY
  # =====================================================================
  - key: cfnaid_weak
    block: composite
    weight: 2
    input: { key: cfnaid, transform: ma3 }
    evaluator:
      type: levels
      params:
        levels:
          - { state: critical, op: "<", threshold: -1.0 }
          - { state: warning, op: "<", threshold: -0.7 }
          - { state: watch, op: "<", threshold: -0.35 }
        exit_above: -0.2
    hist:
      sample: "1967–2026, measured 2026-10"
      recessions_covered: 8
      precision: 0.17
      recall: 0.38
      median_lead_months: 8
      note: "CFNAI-MA3 < -0.7 is near-coincident more than leading (Chicago Fed's own rule: 'recession may have begun'). Replaces USSLIND/LEI — discontinued on FRED in 2020-02."

  - key: indpro_decline
    block: composite
    weight: 1
    input: { key: indpro, transform: value }
    evaluator:
      type: yoy
      params: { op: "<", threshold: 0, warn: 2 }
    hist:
      sample: "1966–2026, measured 2026-10"
      recessions_covered: 8
      precision: 0.18
      recall: 0.5
      median_lead_months: 9
      note: "YoY<0 also fires in industrial slowdowns (2015–16, 2023–24) — confirmatory. Near-coincident NBER input."

  # =====================================================================
  # NOWCAST — "are we already in recession?" (not part of 12m score)
  # =====================================================================
  - key: sahm_rule
    block: nowcast
    weight: 0
    input: { key: sahm, transform: value }
    evaluator:
      type: levels
      params:
        levels:
          - { state: critical, op: ">=", threshold: 0.5 }
        exit_below: 0.4
    hist:
      sample: "1949–2026, measured window [-3,+6]m around start"
      episodes: 10
      recessions_covered: 8
      recall: 1.0
      median_lead_months: -3
      note: "Triggers ~3.4m AFTER official start on average — onset confirmation, not a forecast. Precision@12m is meaningless here (measured at ±onset window instead). FPs: 1959, 1969 (timing), 2024."

  - key: chauvet_piger
    block: nowcast
    weight: 0
    input: { key: recprob_chauvet, transform: value }
    evaluator:
      type: levels
      params:
        levels:
          - { state: warning, op: ">", threshold: 20 }
          - { state: critical, op: ">", threshold: 50 }
        exit_below: 15
    hist:
      sample: "1967–2026"
      recessions_covered: 8
      recall: 0.95
      note: "Smoothed recession probability (Chauvet–Piger), NBER-consistent. Nowcast: fires at/around starts, not a 12m forecast."

  - key: sahm_states
    block: nowcast
    weight: 0
    input: { key: unrate, transform: value }
    min_event_gap_hours: 48 # state URs arrive in a batch; don't flap alerts
    evaluator:
      type: sahm_states
      params:
        keys: [ur_state_al, ur_state_ak, ur_state_az, ur_state_ar, ur_state_ca, ur_state_co, ur_state_ct, ur_state_de, ur_state_dc, ur_state_fl, ur_state_ga, ur_state_hi, ur_state_id, ur_state_il, ur_state_in, ur_state_ia, ur_state_ks, ur_state_ky, ur_state_la, ur_state_me, ur_state_md, ur_state_ma, ur_state_mi, ur_state_mn, ur_state_ms, ur_state_mo, ur_state_mt, ur_state_ne, ur_state_nv, ur_state_nh, ur_state_nj, ur_state_nm, ur_state_ny, ur_state_nc, ur_state_nd, ur_state_oh, ur_state_ok, ur_state_or, ur_state_pa, ur_state_ri, ur_state_sc, ur_state_sd, ur_state_tn, ur_state_tx, ur_state_ut, ur_state_vt, ur_state_va, ur_state_wa, ur_state_wv, ur_state_wi, ur_state_wy]
        trigger: 0.5
        warn_count: 5
        critical_count: 10
    # EXPERIMENTAL (PLAN2 §7): state-level Sahm is noisier than the national
    # rule — count thresholds are starting points, no hist stats yet.

